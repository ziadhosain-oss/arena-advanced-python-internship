{% extends 'base.html' %}

{% block content %}
    <div class="card">
        <h2>Confirm Delete</h2>
        <p>Are you sure you want to delete the job "{{ job.title }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button class="button" type="submit">Yes, delete</button>
            <a class="button button-alt" href="{% url 'jobs:employer_dashboard' %}">Cancel</a>
        </form>
    </div>
{% endblock %}
