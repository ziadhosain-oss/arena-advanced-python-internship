{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LMS Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav style="background: #2196f3; padding: 15px; margin-bottom: 20px; color: white;">
        <div class="container" style="box-shadow: none; background: transparent; padding: 0; display: flex; gap: 20px;">
            <a href="{% url 'dashboard' %}" style="color: white; text-decoration: none; font-weight: bold;">📊 Dashboard</a>
            <a href="{% url 'mark_attendance' %}" style="color: white; text-decoration: none; font-weight: bold;">📝 Attendance</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
