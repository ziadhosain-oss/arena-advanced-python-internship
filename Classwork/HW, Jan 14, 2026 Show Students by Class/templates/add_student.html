{% extends "base.html" %}

{% block content %}
<h1>Add New Student</h1>

<div class="card">
    <form method="POST" action="{{ url_for('add_student') }}">
        <div class="form-group">
            <label for="roll_number">Roll Number *</label>
            <input type="text" id="roll_number" name="roll_number" required>
        </div>
        
        <div class="form-group">
            <label for="name">Student Name *</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone">
        </div>
        
        <div class="form-group">
            <label for="class_id">Class *</label>
            <select id="class_id" name="class_id" required onchange="loadSections()">
                <option value="">Select Class</option>
                {% for class in classes %}
                    <option value="{{ class.id }}">{{ class.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="section_id">Section *</label>
            <select id="section_id" name="section_id" required>
                <option value="">Select Class First</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Add Student</button>
        <a href="{{ url_for('list_students') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script>
function loadSections() {
    const classId = document.getElementById('class_id').value;
    const sectionSelect = document.getElementById('section_id');
    
    if (classId) {
        fetch(`/api/sections/${classId}`)
            .then(response => response.json())
            .then(sections => {
                sectionSelect.innerHTML = '<option value="">Select Section</option>';
                sections.forEach(section => {
                    sectionSelect.innerHTML += `<option value="${section.id}">Section ${section.name}</option>`;
                });
            });
    } else {
        sectionSelect.innerHTML = '<option value="">Select Class First</option>';
    }
}
</script>
{% endblock %}
